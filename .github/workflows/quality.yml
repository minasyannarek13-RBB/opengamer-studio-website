name: OpenGamer Quality

on:
  push:
    branches:
      - build/contact-conversion-handoff-20260908
  pull_request:
    branches:
      - v2-current

permissions:
  contents: read

concurrency:
  group: opengamer-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Production config tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium and WebKit
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Rendered Chromium visual QA
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: pnpm qa:visual -- --skip-build

      - name: Rendered WebKit release smoke QA
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
        run: node scripts/visual-qa-webkit.mjs

      - name: Upload rendered QA diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-qa-diagnostics-${{ github.run_id }}
          path: |
            qa/screenshots/summary.json
            qa/screenshots/webkit-summary.json
            qa/screenshots/webkit/
          if-no-files-found: warn
          retention-days: 7
