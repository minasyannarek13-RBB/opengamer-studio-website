name: OpenGamer Quality

on:
  push:
    branches:
      - build/contact-conversion-handoff-20260908
  pull_request:
    branches:
      - v2-current

permissions:
  contents: read

concurrency:
  group: opengamer-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Production config tests
        run: pnpm test

      - name: Build
        run: pnpm build
